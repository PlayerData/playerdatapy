name: Publish Python

on:
  workflow_call:
    inputs:
      new_release_published:
        description: 'Whether a new release has been published'
        required: true
        type: string
      new_release_version:
        description: 'The latest release version'
        required: true
        type: string

jobs:
  publish:
    name: Publish Python Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-suffix: '-publish'
          activate-environment: true

      - name: Apply Semantic Version
        if: ${{ inputs.new_release_published == 'true' }}
        run: uv version ${{ inputs.new_release_version }}

      - name: Build
        if: ${{ inputs.new_release_published == 'true' }}
        run: uv build

      - name: Publish
        if: ${{ inputs.new_release_published == 'true' }}
        run: uv publish --trusted-publishing always

